name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Full CI
        run: deno task ci

      - name: Setup Node (Trusted Publishing)
        uses: actions/setup-node@v6
        with:
          # Trusted Publishing requires npm >= 11.5.1 (Node 22 images ship npm 10.x → misleading 404)
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Verify npm CLI (Trusted Publishing)
        run: |
          node -v
          NPM_VER=$(npm -v)
          echo "npm ${NPM_VER}"
          node -e "
            const v = process.argv[1].split('.').map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) {
              console.error('npm >= 11.5.1 required for Trusted Publishing (use Node 24.x in CI)');
              process.exit(1);
            }
          " "$NPM_VER"

      # JSR publish does not need dnt output. --allow-dirty: test:compat runs npm install and updates compat lockfiles.
      - name: Publish to JSR
        run: deno task publish:jsr:ci

      - name: Build npm packages (dnt)
        run: deno task build:npm

      - name: Publish to npm
        run: deno task publish:npm:ci
