name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: CI checks
        run: deno task ci

      - name: Publish dry-run (JSR)
        run: deno task publish:dry-run

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org

      - name: Build npm packages (dnt)
        run: deno task build:npm

      - name: Publish to JSR
        run: |
          deno publish --allow-slow-types --config packages/core/deno.json
          deno publish --allow-slow-types --config packages/express/deno.json
          deno publish --allow-slow-types --config packages/hono/deno.json
          deno publish --allow-slow-types --config packages/fresh/deno.json
          deno publish --allow-slow-types --config packages/graphql/deno.json
          deno publish --allow-slow-types --config packages/next/deno.json

      - name: npm publish dry-run
        run: deno task publish:npm:dry-run

      - name: Publish to npm
        run: deno task publish:npm
