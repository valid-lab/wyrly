name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: CI checks
        run: deno task ci

      - name: Publish dry-run (JSR)
        run: deno task publish:dry-run

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing requires npm >= 11.5.1 (Node 22 images ship npm 10.x → misleading 404)
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Verify npm CLI (Trusted Publishing)
        run: |
          node -v
          NPM_VER=$(npm -v)
          echo "npm ${NPM_VER}"
          node -e "
            const v = process.argv[1].split('.').map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) {
              console.error('npm >= 11.5.1 required for Trusted Publishing (use Node 24.x in CI)');
              process.exit(1);
            }
          " "$NPM_VER"

      - name: Build npm packages (dnt)
        run: deno task build:npm

      - name: Publish to JSR
        run: |
          deno publish --allow-slow-types --config packages/core/deno.json
          deno publish --allow-slow-types --config packages/express/deno.json
          deno publish --allow-slow-types --config packages/hono/deno.json
          deno publish --allow-slow-types --config packages/fresh/deno.json
          deno publish --allow-slow-types --config packages/graphql/deno.json
          deno publish --allow-slow-types --config packages/next/deno.json

      - name: npm publish dry-run
        run: deno task publish:npm:dry-run

      - name: Publish to npm
        run: deno task publish:npm:ci
