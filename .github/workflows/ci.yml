name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "examples/**"
      - "scripts/**"
      - "compat/**"
      - "deno.jsonc"
      - "deno.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "examples/**"
      - "scripts/**"
      - "compat/**"
      - "deno.jsonc"
      - "deno.lock"
      - ".github/workflows/ci.yml"

jobs:
  deno:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno task test

      - name: Examples
        run: deno task examples

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Publish dry-run (JSR)
        run: deno task publish:dry-run

      - name: Build npm (dnt)
        run: deno task build:npm

      - name: npm publish dry-run
        run: deno task publish:npm:dry-run

  compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build npm (core + hono)
        run: deno task build:npm:compat

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Node compat smoke tests
        run: deno task test:compat:node

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Bun compat smoke tests
        run: deno task test:compat:bun

      - name: Workers compat smoke tests
        run: deno task test:compat:workers
