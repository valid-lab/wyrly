name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "examples/**"
      - "scripts/**"
      - "benchmarks/di/**"
      - "compat/**"
      - "deno.jsonc"
      - "deno.lock"
      - "lefthook.yml"
      - "README.md"
      - "README.ja.md"
      - "SECURITY.md"
      - "SECURITY.ja.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING.ja.md"
      - "CHANGELOG.md"
      - "CHANGELOG.ja.md"
      - "PUBLISHING.md"
      - "PUBLISHING.ja.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/bench-di.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "examples/**"
      - "scripts/**"
      - "benchmarks/di/**"
      - "compat/**"
      - "deno.jsonc"
      - "deno.lock"
      - "lefthook.yml"
      - "README.md"
      - "README.ja.md"
      - "SECURITY.md"
      - "SECURITY.ja.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING.ja.md"
      - "CHANGELOG.md"
      - "CHANGELOG.ja.md"
      - "PUBLISHING.md"
      - "PUBLISHING.ja.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/bench-di.yml"
      - ".github/dependabot.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Full CI
        run: deno task ci

  bench-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"

      - name: Run Wyrly DI bench
        run: deno task bench:di:ci

      - name: Report bench metrics (GHA)
        run: deno run -A scripts/ci/check-di-bench.ts --report

      - name: Check regression vs baseline
        run: deno task bench:di:check
